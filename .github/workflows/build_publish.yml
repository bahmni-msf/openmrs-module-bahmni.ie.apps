name: Build and Publish package
on:
  push:
    branches: [ githubActions ]

jobs:
  build-publish-package:
    name: Build and Publish package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Set up JDK 1.8
        uses: actions/setup-java@v1
        with:
          java-version: 1.8
      - name: Build with Maven
        run: ./mvnw --no-transfer-progress clean install
      - name: set Omod name
        run: 
          echo "OMOD_NAME=$(basename "$(ls -1 omod/target/*.omod)" .omod)" >> $GITHUB_ENV
      - name: set Omod name
        run:
          echo ${{env.OMOD_NAME}}
